name: Enviar notificaciones push AlFaroCafé

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alfaro-push-dispatch
  cancel-in-progress: false

jobs:
  despachar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar librería web-push
        run: npm install --no-save web-push

      - name: Comprobar credencial del despachador
        env:
          ALFARO_DISPATCH_SECRET: ${{ secrets.ALFARO_DISPATCH_SECRET }}
        run: |
          if [ -z "$ALFARO_DISPATCH_SECRET" ]; then
            echo "::error::Falta el secreto ALFARO_DISPATCH_SECRET en Settings > Actions > Secrets."
            exit 1
          fi
      - name: Ejecutar despachador de notificaciones
        env:
          ALFARO_DISPATCH_SECRET: ${{ secrets.ALFARO_DISPATCH_SECRET }}
        run: node scripts/push-dispatch.mjs
