name: Verificar compilacion y pruebas
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Comprobar archivos de actualizacion PWA
        run: |
          test -s dist/version.json
          test -s dist/sw.js
          node -e "const f = require('fs'); const v=JSON.parse(f.readFileSync('dist/version.json','utf8')); if(!v.buildId || !/^\\d{4}-\\d{2}-\\d{2}T/.test(v.buildId)) process.exit(1); console.log('Build PWA:',v.buildId)"
      - run: npm test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --config supabase/functions/alfaro-push-dispatch/deno.json supabase/functions/alfaro-push-dispatch/index.ts
